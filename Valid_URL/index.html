<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Validator</title>
    <link rel="stylesheet" href="styles.css">
    <!-- SheetJS for Excel file processing -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Mammoth.js for Word document processing -->
    <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
    <!-- FileSaver.js for file downloads -->
    <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>URL Validator</h1>
            <p class="subtitle">Upload a file to extract and validate all URLs</p>
        </header>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <p class="upload-text">Drag and drop your file here</p>
                    <p class="upload-hint">or click to browse</p>
                    <p class="supported-formats">Supported: Excel (.xlsx, .xls), Word (.docx), CSV (.csv), Firefox Bookmarks (.json)</p>
                </div>
                <input type="file" id="fileInput" accept=".xlsx,.xls,.docx,.csv,.json" hidden>
            </div>
            <div class="file-info" id="fileInfo" style="display: none;">
                <span id="fileName"></span>
                <button class="btn-secondary" id="clearFile">Clear</button>
            </div>
        </div>

        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">Processing...</p>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2>Validation Results</h2>
                <div class="results-actions">
                    <button class="btn-primary" id="downloadBtn" disabled>Download Modified File</button>
                    <div class="filter-controls">
                        <select id="statusFilter">
                            <option value="all">All Statuses</option>
                            <option value="200">Success (200)</option>
                            <option value="error">Errors</option>
                            <option value="cors">CORS Blocked</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="table-container">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>URL</th>
                            <th>Status</th>
                            <th>Source</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="resultsBody">
                    </tbody>
                </table>
            </div>
            <div class="results-summary" id="resultsSummary"></div>
        </div>

        <div class="error-message" id="errorMessage" style="display: none;"></div>
    </div>

    <script src="fileParser.js"></script>
    <script src="urlValidator.js"></script>
    <script src="app.js"></script>
</body>
</html>
